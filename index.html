<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Tours de Hanoï</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Les Tours de Hanoï</h1>

    <main>
        <div id="plateau">
            <div class="tour" id="tour-1" data-index="0"></div>
            <div class="tour" id="tour-2" data-index="1"></div>
            <div class="tour" id="tour-3" data-index="2"></div>
        </div>

        <div class="commandes">
            <label for="nb-anneaux">Nombre d'anneaux :</label>

            <input
                type="number"
                id="nb-anneaux"
                min="1"
                max="8"
                value="3"
            >

            <button id="btn-demarrer">Démarrer</button>
        </div>

        <p id="message" aria-live="polite">
            Cliquez sur Démarrer pour commencer.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
