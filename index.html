<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Tours de Hanoï</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <header>
        <h1>Les Tours de Hanoï</h1>
        <p class="sous-titre">Déplacez tous les anneaux vers la troisième tour.</p>
    </header>

    <main class="conteneur">

        <section class="jeu">

            <div class="instructions">
                <span class="icone">🎯</span>
                <p>Un seul anneau à la fois. Un grand anneau ne peut jamais recouvrir un petit.</p>
            </div>

            <div id="plateau">

                <div class="zone-tour">
                    <div class="numero-tour">01</div>
                    <div class="tour" id="tour-1" data-index="0"></div>
                    <span class="nom-tour">Départ</span>
                </div>

                <div class="zone-tour">
                    <div class="numero-tour">02</div>
                    <div class="tour" id="tour-2" data-index="1"></div>
                    <span class="nom-tour">Intermédiaire</span>
                </div>

                <div class="zone-tour">
                    <div class="numero-tour">03</div>
                    <div class="tour" id="tour-3" data-index="2"></div>
                    <span class="nom-tour">Arrivée</span>
                </div>

            </div>

            <div class="zone-message">
                <p id="message" aria-live="polite">
                    Cliquez sur Démarrer pour commencer à jouer.
                </p>
            </div>

        </section>

        <section class="parametres">

            <div class="parametre">
                <label for="nb-anneaux">Nombre d'anneaux</label>

                <input
                    type="number"
                    id="nb-anneaux"
                    min="1"
                    max="8"
                    value="3"
                >
            </div>

            <button id="btn-demarrer">
                <span>↻</span> Démarrer
            </button>

        </section>

        <footer>
            <p>Les Tours de Hanoï · Jeu de réflexion</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
